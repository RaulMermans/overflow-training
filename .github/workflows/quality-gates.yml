name: Quality Gates

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

jobs:
  pr-quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Format Check
        run: npm run format

      - name: Fetch PR Base Branch
        run: git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"

      - name: Governance Drift Check
        run: npm run check:governance -- --base=origin/${{ github.base_ref }} --pr-title="${{ github.event.pull_request.title }}"

      - name: Node Modules Integrity Check
        run: npm run check:node-modules-integrity

      - name: Duplicate Suffix File Check
        run: npm run check:no-duplicate-suffix-files

      - name: Supabase Contract Verification
        run: npm run db:verify:contract

      - name: Theme Token Compliance Check
        run: npm run lint:no-hex

      - name: Lint No New Debt
        run: npm run lint:no-new-debt

      - name: Strict Lint on Touched Files
        run: npm run lint:touched -- --base=origin/${{ github.base_ref }}

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm test -- --runInBand

  main-release-quality:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Format Check
        run: npm run format

      - name: Governance Drift Check
        run: npm run check:governance -- --base=HEAD~1
        env:
          ALLOW_ESLINT_BASELINE_UPDATE: ${{ contains(github.event.head_commit.message, 'Merge pull request') && '1' || '' }}

      - name: Node Modules Integrity Check
        run: npm run check:node-modules-integrity

      - name: Duplicate Suffix File Check
        run: npm run check:no-duplicate-suffix-files

      - name: Supabase Contract Verification
        run: npm run db:verify:contract

      - name: Theme Token Compliance Check
        run: npm run lint:no-hex

      - name: Lint No New Debt
        run: npm run lint:no-new-debt

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm test -- --runInBand

      - name: Release Identity Check
        run: npm run release:identity
