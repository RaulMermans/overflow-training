# Calendar planned start entry guardrail.
# Verifies day -> planned start -> workout session root reliably.
# Requires: E2E_EMAIL, E2E_PASSWORD, E2E_DATE

appId: com.workout-tracker.ios
---
- launchApp
- assertVisible:
    id: login:emailInput
- inputText:
    id: login:emailInput
    text: '${E2E_EMAIL}'
- inputText:
    id: login:passwordInput
    text: '${E2E_PASSWORD}'
- tapOn:
    id: login:submitButton
- extendedWaitFor:
    visibility:
      id: workout:primaryActionCard
    timeout: 15000
- tapOn: 'Calendar'
- extendedWaitFor:
    visibility:
      id: calendar:monthLabel
    timeout: 5000
- extendedWaitFor:
    visibility:
      id: 'calendar:day:${E2E_DATE}'
    timeout: 8000
- tapOn:
    id: 'calendar:day:${E2E_DATE}'
- extendedWaitFor:
    visibility:
      id: calendar:daySheet
    timeout: 5000
- runFlow:
    when:
      visible:
        id: calendar:addPlanButton
    commands:
      - tapOn:
          id: calendar:addPlanButton
      - extendedWaitFor:
          visibility:
            id: calendar:routinePicker
          timeout: 8000
      - tapOn:
          id: calendar:routineRow
          index: 0
      - extendedWaitFor:
          visibility:
            id: calendar:daySheet
          timeout: 5000
- extendedWaitFor:
    visibility:
      id: calendar:startWorkoutButton
    timeout: 5000
- tapOn:
    id: calendar:startWorkoutButton
- extendedWaitFor:
    visibility:
      id: workoutSession:root
    timeout: 15000
