# Workout Session Torture Flow: start -> add sets -> app restart -> resume -> finish
# Requires: E2E_EMAIL, E2E_PASSWORD

appId: com.workout-tracker.ios
---
- launchApp
- assertVisible:
    id: login:emailInput
- inputText:
    id: login:emailInput
    text: '${E2E_EMAIL}'
- inputText:
    id: login:passwordInput
    text: '${E2E_PASSWORD}'
- tapOn:
    id: login:submitButton
- extendedWaitFor:
    visibility:
      id: workout:primaryActionCard
    timeout: 15000

- tapOn: 'Start from a routine'
- extendedWaitFor:
    visibility:
      id: routines:newRoutineButton
    timeout: 5000
- tapOn:
    id: routines:newRoutineButton
- extendedWaitFor:
    visibility:
      id: routineNew:nameInput
    timeout: 5000
- inputText:
    id: routineNew:nameInput
    text: 'E2E Torture Routine'
- tapOn: 'Add exercise'
- extendedWaitFor:
    visibility:
      id: exerciseSearch:exerciseRow
    timeout: 8000
- tapOn:
    id: exerciseSearch:exerciseRow
    index: 0
- tapOn:
    id: routineNew:saveButton
- extendedWaitFor:
    visibility:
      text: 'E2E Torture Routine'
    timeout: 10000

- tapOn: 'Calendar'
- extendedWaitFor:
    visibility:
      text: 'Today'
    timeout: 5000
- tapOn:
    point: '50%,55%'
- extendedWaitFor:
    visibility:
      id: calendar:addPlanButton
    timeout: 5000
- tapOn:
    id: calendar:addPlanButton
- extendedWaitFor:
    visibility:
      text: 'E2E Torture Routine'
    timeout: 5000
- tapOn: 'E2E Torture Routine'
- extendedWaitFor:
    visibility:
      id: calendar:startWorkoutButton
    timeout: 5000
- tapOn:
    id: calendar:startWorkoutButton
- extendedWaitFor:
    visibility:
      id: workoutSession:finishButton
    timeout: 15000

- tapOn:
    id: workoutSession:addSetButton
- tapOn:
    id: workoutSession:addSetButton

# Simulate app background/foreground by stopping and relaunching with persisted state.
- stopApp
- launchApp
- extendedWaitFor:
    visibility:
      id: workoutSession:finishButton
    timeout: 15000

- tapOn:
    id: workoutSession:addSetButton
- tapOn:
    id: workoutSession:finishButton
- extendedWaitFor:
    visibility:
      id: workoutSession:finishSubmitButton
    timeout: 5000
- tapOn:
    id: workoutSession:finishSubmitButton
- extendedWaitFor:
    visibility:
      id: workout:primaryActionCard
    timeout: 15000

- tapOn: 'Profile'
- extendedWaitFor:
    visibility:
      id: profile:workoutsCount
    timeout: 5000
- assertVisible:
    id: profile:workoutsCount
