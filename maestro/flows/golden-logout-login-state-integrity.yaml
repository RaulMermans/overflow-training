# Golden Flow 3: logout → login again → no corrupted local state
# Creates routine, logs out, logs in again, verifies no duplicates and sync healthy.
# Requires: E2E_EMAIL, E2E_PASSWORD

appId: com.workout-tracker.ios
---
- launchApp
- assertVisible:
    id: login:emailInput
- inputText:
    id: login:emailInput
    text: '${E2E_EMAIL}'
- inputText:
    id: login:passwordInput
    text: '${E2E_PASSWORD}'
- tapOn:
    id: login:submitButton
- extendedWaitFor:
    visibility:
      id: workout:primaryActionCard
    timeout: 15000
# Create routine so we have data to verify after re-login
- tapOn: 'Start from a routine'
- extendedWaitFor:
    visibility:
      id: routines:newRoutineButton
    timeout: 5000
- tapOn:
    id: routines:newRoutineButton
- extendedWaitFor:
    visibility:
      id: routineNew:nameInput
    timeout: 5000
- inputText:
    id: routineNew:nameInput
    text: 'E2E State Integrity Routine'
- tapOn: 'Add exercise'
- extendedWaitFor:
    visibility:
      id: exerciseSearch:exerciseRow
    timeout: 8000
- tapOn:
    id: exerciseSearch:exerciseRow
    index: 0
- tapOn:
    id: routineNew:saveButton
- extendedWaitFor:
    visibility:
      text: 'E2E State Integrity Routine'
    timeout: 10000
# Logout
- tapOn: 'Profile'
- extendedWaitFor:
    visibility:
      id: profile:signOutButton
    timeout: 5000
- tapOn:
    id: profile:signOutButton
- extendedWaitFor:
    visibility:
      id: login:emailInput
    timeout: 5000
- assertVisible:
    id: login:emailInput
# Login again
- inputText:
    id: login:emailInput
    text: '${E2E_EMAIL}'
- inputText:
    id: login:passwordInput
    text: '${E2E_PASSWORD}'
- tapOn:
    id: login:submitButton
- extendedWaitFor:
    visibility:
      id: workout:primaryActionCard
    timeout: 15000
- assertVisible:
    id: workout:primaryActionCard
# Verify routine still present (no corrupted state / no duplicates)
- tapOn: 'Start from a routine'
- extendedWaitFor:
    visibility:
      text: 'E2E State Integrity Routine'
    timeout: 10000
- assertVisible:
    text: 'E2E State Integrity Routine'
# Sync state healthy
- assertVisible:
    id: syncPill:chip
