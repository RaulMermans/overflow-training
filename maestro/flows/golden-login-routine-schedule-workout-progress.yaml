# Golden Flow 1: login → create routine → schedule day → start workout → finish → progress updates
# Requires: E2E_EMAIL, E2E_PASSWORD, E2E_DATE env vars (from e2e/helpers/auth.ts create)
# Run: maestro test maestro/flows/golden-login-routine-schedule-workout-progress.yaml --env E2E_EMAIL=... --env E2E_PASSWORD=... --env E2E_DATE="$(xcrun simctl spawn booted date +%Y-%m-15)"

appId: com.workout-tracker.ios
---
- launchApp
- assertVisible:
    id: login:emailInput
- inputText:
    id: login:emailInput
    text: '${E2E_EMAIL}'
- inputText:
    id: login:passwordInput
    text: '${E2E_PASSWORD}'
- tapOn:
    id: login:submitButton
- extendedWaitFor:
    visibility:
      id: workout:primaryActionCard
    timeout: 15000
- assertVisible:
    id: workout:primaryActionCard
# Navigate to Routines (via "Start from a routine" or "Create routine" when empty)
- tapOn: 'Start from a routine'
- extendedWaitFor:
    visibility:
      id: routines:newRoutineButton
    timeout: 5000
- tapOn:
    id: routines:newRoutineButton
- extendedWaitFor:
    visibility:
      id: routineNew:nameInput
    timeout: 5000
- inputText:
    id: routineNew:nameInput
    text: 'E2E Golden Routine'
- tapOn: 'Add exercise'
- extendedWaitFor:
    visibility:
      id: exerciseSearch:exerciseRow
    timeout: 8000
- tapOn:
    id: exerciseSearch:exerciseRow
    index: 0
- tapOn:
    id: routineNew:saveButton
- extendedWaitFor:
    visibility:
      text: 'E2E Golden Routine'
    timeout: 10000
# Go to Calendar tab and open day sheet
- tapOn: 'Calendar'
- extendedWaitFor:
    visibility:
      id: calendar:monthLabel
    timeout: 5000
- extendedWaitFor:
    visibility:
      id: 'calendar:day:${E2E_DATE}'
    timeout: 5000
- tapOn:
    id: 'calendar:day:${E2E_DATE}'
- extendedWaitFor:
    visibility:
      id: calendar:addPlanButton
    timeout: 5000
- tapOn:
    id: calendar:addPlanButton
- extendedWaitFor:
    visibility:
      text: 'E2E Golden Routine'
    timeout: 5000
- tapOn: 'E2E Golden Routine'
- extendedWaitFor:
    visibility:
      id: calendar:startWorkoutButton
    timeout: 5000
- tapOn:
    id: calendar:startWorkoutButton
- extendedWaitFor:
    visibility:
      id: workoutSession:finishButton
    timeout: 15000
- tapOn:
    id: workoutSession:addSetButton
- extendedWaitFor:
    visibility:
      id: workoutSession:finishButton
    timeout: 3000
- tapOn:
    id: workoutSession:finishButton
- extendedWaitFor:
    visibility:
      id: workoutSession:finishSubmitButton
    timeout: 5000
- tapOn:
    id: workoutSession:finishSubmitButton
- extendedWaitFor:
    visibility:
      id: workout:primaryActionCard
    timeout: 15000
- tapOn: 'Profile'
- extendedWaitFor:
    visibility:
      id: profile:workoutsCount
    timeout: 5000
- assertVisible:
    id: profile:workoutsCount
- assertVisible:
    id: syncPill:chip
